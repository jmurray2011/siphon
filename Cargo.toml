[package]
name = "siphon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Config-driven daemon that mirrors HTTP APIs into SQLite, scheduling polls against a measured rate-limit budget"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "charset",
    "http2",
] }
# Pinned below 0.40: its libsqlite3-sys build script uses `cfg_select`, which
# needs a newer rustc than the 1.92 this is built against. `bundled` is what
# makes the single-binary promise hold - no libsqlite3 on the host.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 9535 compliant, unlike the older ad-hoc jsonpath crates.
serde_json_path = "0.7"
# A maintained fork of serde_yaml, which is unmaintained (RUSTSEC-2024-0370)
# and would fail `cargo deny check advisories`.
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
] }
# `runtime` is what provides `connect()`; without it only a pre-made stream can
# be used. No TLS feature: this speaks plaintext, which is fine on loopback and
# is not fine across a network - see `postgres::PgStore::connect`.
tokio-postgres = { version = "0.7.18", default-features = false, features = [
    "runtime",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "test-util",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
