[package]
name = "siphon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Config-driven daemon that mirrors HTTP APIs into SQLite or Postgres, scheduling polls against a measured rate-limit budget"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
jiff = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "charset",
    "http2",
] }
# Pinned below 0.40: its libsqlite3-sys build script uses `cfg_select`, which
# needs a newer rustc than the 1.92 this is built against. `bundled` is what
# makes the single-binary promise hold - no libsqlite3 on the host.
rusqlite = { version = "0.37", features = ["bundled"] }
# Pinned to the `ring` provider. rustls defaults to `aws-lc-rs`, which needs a C
# toolchain and would break the static musl build and the no-C-dependency rule.
# reqwest already builds rustls with ring, so this shares one stack rather than
# linking two.
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# Root certificates come from the OS trust store rather than a bundled copy, so
# a private CA is trusted the same way everything else on the host trusts it.
rustls-native-certs = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 9535 compliant, unlike the older ad-hoc jsonpath crates.
serde_json_path = "0.7"
# A maintained fork of serde_yaml, which is unmaintained (RUSTSEC-2024-0370)
# and would fail `cargo deny check advisories`.
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
] }
# `runtime` is what provides `connect()`; without it only a pre-made stream can
# be used. TLS comes from tokio-postgres-rustls rather than a feature here.
tokio-postgres = { version = "0.7.18", default-features = false, features = [
    "runtime",
] }
tokio-postgres-rustls = "0.14.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "test-util",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
